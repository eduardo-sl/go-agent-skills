<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="go-agent-skills: curated Go skills for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06202B"/>
      <stop offset="55%" stop-color="#08303F"/>
      <stop offset="100%" stop-color="#052029"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FE3F2"/>
      <stop offset="100%" stop-color="#4FBEDA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#7FE7C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.40"/>
      <stop offset="70%" stop-color="#00ADD8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0E4B5E" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="27" fill="none" stroke="#125A70" stroke-width="3"/>

  <!-- ambient glow behind the gopher -->
  <circle cx="235" cy="205" r="185" fill="url(#glow)"/>

  <!-- circuit traces from the gopher toward the skill cards -->
  <g stroke="#12708A" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M360 150 H430 V96 H520"/>
    <path d="M360 205 H470"/>
    <path d="M360 262 H430 V318 H520"/>
  </g>
  <g fill="#00ADD8">
    <circle cx="430" cy="96" r="4.5"/><circle cx="470" cy="205" r="4.5"/><circle cx="430" cy="318" r="4.5"/>
  </g>

  <!-- ============ gopher ============ -->
  <g>
    <!-- antenna: the "agent" tell -->
    <path d="M235 74 V44" stroke="#1B4553" stroke-width="7" stroke-linecap="round"/>
    <circle cx="235" cy="36" r="11" fill="#7FE7C4" stroke="#1B4553" stroke-width="4"/>
    <circle cx="235" cy="36" r="20" fill="none" stroke="#7FE7C4" stroke-width="2" stroke-opacity="0.45"/>

    <!-- ears -->
    <circle cx="176" cy="96" r="23" fill="url(#fur)" stroke="#1B4553" stroke-width="5"/>
    <circle cx="294" cy="96" r="23" fill="url(#fur)" stroke="#1B4553" stroke-width="5"/>

    <!-- arms, behind the body so the seam is hidden -->
    <ellipse cx="128" cy="240" rx="24" ry="34" fill="url(#fur)" stroke="#1B4553" stroke-width="5"/>
    <ellipse cx="342" cy="240" rx="24" ry="34" fill="url(#fur)" stroke="#1B4553" stroke-width="5"/>

    <!-- body -->
    <path d="M235 74
             c-62 0 -104 44 -104 112
             v58
             c0 62 44 104 104 104
             s104 -42 104 -104
             v-58
             c0 -68 -42 -112 -104 -112 z"
          fill="url(#fur)" stroke="#1B4553" stroke-width="5"/>

    <!-- belly -->
    <ellipse cx="235" cy="256" rx="60" ry="72" fill="#EAFBFF" fill-opacity="0.5"/>

    <!-- eyes -->
    <circle cx="196" cy="140" r="42" fill="#FFFFFF" stroke="#1B4553" stroke-width="5"/>
    <circle cx="278" cy="140" r="42" fill="#FFFFFF" stroke="#1B4553" stroke-width="5"/>
    <circle cx="209" cy="146" r="17" fill="#15343F"/>
    <circle cx="265" cy="146" r="17" fill="#15343F"/>
    <circle cx="215" cy="139" r="5.5" fill="#FFFFFF"/>
    <circle cx="271" cy="139" r="5.5" fill="#FFFFFF"/>

    <!-- snout + teeth -->
    <ellipse cx="237" cy="186" rx="13" ry="10" fill="#15343F"/>
    <rect x="224" y="196" width="26" height="21" rx="5" fill="#FFFFFF" stroke="#1B4553" stroke-width="4"/>
    <path d="M237 197 V216" stroke="#1B4553" stroke-width="3"/>

    <!-- feet -->
    <ellipse cx="199" cy="344" rx="27" ry="14" fill="#F2A65A" stroke="#1B4553" stroke-width="5"/>
    <ellipse cx="271" cy="344" rx="27" ry="14" fill="#F2A65A" stroke="#1B4553" stroke-width="5"/>
  </g>

  <!-- ============ floating skill cards ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <g>
      <rect x="520" y="72" width="232" height="48" rx="12" fill="#0B3A4A" stroke="#1E7E99" stroke-width="2"/>
      <circle cx="546" cy="96" r="6" fill="#7FE7C4"/>
      <text x="566" y="102" fill="#BFEAF5">go-code-review</text>
    </g>
    <g>
      <rect x="520" y="181" width="252" height="48" rx="12" fill="#0B3A4A" stroke="#1E7E99" stroke-width="2"/>
      <circle cx="546" cy="205" r="6" fill="#00ADD8"/>
      <text x="566" y="211" fill="#BFEAF5">go-defensive-coding</text>
    </g>
    <g>
      <rect x="520" y="294" width="284" height="48" rx="12" fill="#0B3A4A" stroke="#1E7E99" stroke-width="2"/>
      <circle cx="546" cy="318" r="6" fill="#F2A65A"/>
      <text x="566" y="324" fill="#BFEAF5">go-concurrency-review</text>
    </g>
  </g>

  <!-- ============ wordmark ============ -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="826" y="172" font-size="44" font-weight="700" fill="#FFFFFF">go-agent<tspan fill="url(#accent)">-skills</tspan></text>
    <rect x="828" y="200" width="286" height="3" rx="1.5" fill="#12708A"/>
    <text x="828" y="240" font-size="21" fill="#8FC7D8">33 curated Go skills</text>
    <text x="828" y="268" font-size="21" fill="#8FC7D8">for AI coding agents</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5FA8BE">
      <text x="828" y="312">Agent Skills spec · MIT</text>
    </g>
  </g>
</svg>
